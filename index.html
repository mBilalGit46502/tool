<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Toolbox</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="smart-toolbox expanded" id="toolbox">
    <div class="toolbox-header" id="dragHandle">
      <h2>Toolbox</h2>
      <button class="minimize-btn" id="minimizeBtn">−</button>
    </div>
    <div class="toolbox-tools" id="toolList">
      
      
     
<!-- ========== [DOWNLOAD COMPONENT START] ========== -->
<div id="downloadSection" class="tool-section">
  <button class="tool-btn" id="downloadBtn">Download</button>

  <div id="downloadOptions" class="download-options hidden">
    <label>Select format:</label>
    <select id="downloadFormat">
      <option value="pdf">PDF</option>
      <option value="html">HTML</option>
      <option value="json">JSON</option>
    </select>
    <button id="confirmDownload">Confirm</button>
    <button id="cancelDownload">Cancel</button>
  </div>
</div>
<!-- ========== [DOWNLOAD COMPONENT END] ========== -->
    
    
    
    </div>
  </div>

  <script src="tool.js"></script>
</body>
</html>
