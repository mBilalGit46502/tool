<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Toolbox</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="smart-toolbox expanded" id="toolbox">
    <div class="toolbox-header" id="dragHandle">
      <h2>Toolbox</h2>
      <button class="minimize-btn" id="minimizeBtn">−</button>
    </div>
    <div class="toolbox-tools" id="toolList">
      <button class="tool-btn" data-tool="highlighter">Highlighter</button>
      <button class="tool-btn" data-tool="print">Print</button>
      <button class="tool-btn" data-tool="download">Download</button>
      <button class="tool-btn theme-toggle">Toggle Theme</button>
    </div>
  </div>

  <script src="tool.js"></script>
</body>
</html>
